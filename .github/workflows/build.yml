name: Desktop builds and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Windows package
        if: runner.os == 'Windows'
        run: python tools/package_release.py --windows build/ci/Release
      - name: Linux package
        if: runner.os == 'Linux'
        run: python3 tools/package_release.py --linux build/ci
      - uses: actions/upload-artifact@v4
        with:
          name: SLINGSHIFT-${{ runner.os }}
          path: dist/*
